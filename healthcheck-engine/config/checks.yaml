heartbeat_interval_seconds: 60

vault:
  addr: "https://vault.example.internal:8200"
  azure_auth_role: "healthcheck-engine"
  mount_point: "azure"

checks:
  - name: "github-status"
    type: "public_api"
    interval_seconds: 120
    params:
      url: "https://www.githubstatus.com/api/v2/status.json"

  - name: "internal-api-noauth"
    type: "public_api"
    interval_seconds: 120
    params:
      url: "https://myservice.internal.example.com/healthz"
      degraded_latency_ms: 1500

  - name: "github-api-authed"
    type: "auth_api"
    interval_seconds: 120
    params:
      url: "https://api.github.com/rate_limit"
      vault_path: "healthchecks/github"
      auth_style: "bearer"

  - name: "terraform-cloud"
    type: "auth_api"
    interval_seconds: 120
    params:
      url: "https://app.terraform.io/api/v2/account/details"
      vault_path: "healthchecks/terraform"
      auth_style: "bearer"

  - name: "azure-status-feed"
    type: "azure_status"
    interval_seconds: 300
    params:
      services:
        - "Virtual Network"
        - "Azure Database for PostgreSQL"

  - name: "google-status-feed"
    type: "google_status"
    interval_seconds: 300
    params:
      services:
        - "Compute Engine"      # matches "Google Compute Engine" service_name (substring)
        - "Cloud SQL"           # matches "Google Cloud SQL" service_name (substring)
      active_only: true

  # The Azure checks below (vnet_capacity, quota) authenticate with an explicit service
  # principal — never DefaultAzureCredential. By default they use the shared engine SPN
  # from the AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET environment
  # variables (the same SPN CredentialManager uses to log in to Vault). To use a DISTINCT
  # SPN for a given check, add the optional params:
  #   vault_path: "healthchecks/azure-spn-readonly"   # secret keys: tenant_id,
  #   vault_mount: "secret"                           # client_id, client_secret
  # which requires the global `vault:` block above to be configured.
  - name: "prod-vnet-capacity"
    type: "vnet_capacity"
    interval_seconds: 900
    params:
      vnets:
        - subscription_id: "<SUBSCRIPTION_ID>"
          resource_group: "rg-prod-networking"
          vnet_name: "vnet-prod-eastus"
          subnet_name: "snet-app"
      degraded_pct: 80
      down_pct: 95

  - name: "prod-compute-quota"
    type: "quota"
    interval_seconds: 900
    params:
      scopes:
        - scope: "/subscriptions/<SUBSCRIPTION_ID>/providers/Microsoft.Compute/locations/eastus"
          resource_name: "standardDSv3Family"
      degraded_pct: 80
      down_pct: 95

  - name: "prod-postgres"
    type: "database"
    interval_seconds: 120
    params:
      engine: "postgres"
      host: "prod-db.internal.example.com"
      port: 5432
      database: "appdb"
      vault_path: "healthchecks/prod-postgres"
      vault_mount: "secret"
      # degraded_latency_ms omitted — inherits the connector's 2000ms default, which
      # is connect-inclusive (TCP + TLS + Postgres auth handshake + query), not query-only.
