[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healthcheck-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "hvac>=2.1",
    "azure-identity>=1.17",
    "azure-mgmt-network>=25.0",
    "azure-mgmt-quota>=1.1",
    "asyncpg>=0.29",
]

[project.scripts]
healthcheck-engine = "healthcheck_engine.main:main"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RUF"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "hvac",
    "hvac.*",
    "azure.identity",
    "azure.mgmt.network",
    "azure.mgmt.quota",
    "yaml",
]
ignore_missing_imports = true
