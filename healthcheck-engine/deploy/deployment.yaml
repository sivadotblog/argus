apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck-engine
  namespace: platform-monitoring
  labels:
    app: healthcheck-engine
spec:
  replicas: 1        # scale by sharding config across replicas if ever needed — not by count
  selector:
    matchLabels:
      app: healthcheck-engine
  template:
    metadata:
      labels:
        app: healthcheck-engine
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: healthcheck-engine
      containers:
        - name: engine
          image: <REGISTRY>/healthcheck-engine:0.1.0
          env:
            - name: CHECKS_CONFIG
              value: /etc/healthcheck/checks.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/healthcheck
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: healthcheck-engine-config
